[workspace]
resolver = "2"
members = ["crates/xdebbie-core", "crates/xdebbied", "crates/xdctl", "crates/capx"]

[profile.release]
strip = true   # drop symbols from shipped binaries (workspace-wide)

[workspace.package]
version = "0.18.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/briankmatheson/xdebbie"
authors = ["Brian Matheson <bmath@brianmatheson.com>"]
