[package]
name = "xdebbied"
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
description = "Small self-hosted cloud: VMs across a few libvirt hosts, with a WireGuard mesh"

[package.metadata.deb]
# Debian revision: bump when the same crate version is rebuilt and installed.
revision = "1"
# Maintainer: the workspace's first author (cargo-deb's default).
copyright = "2026 Brian Matheson and XDebbie contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
XDebbie turns a few Debian servers running QEMU/KVM and libvirt into one \
small cloud that places, runs, moves and heals VMs, and serves them to \
Kubernetes through Cluster API.
.
The first box bootstraps itself on install: libvirt network and storage \
pool, config, cluster CA, API certificate and token. Other boxes join with \
`xdebbied bootstrap --join` and an operator's `xdctl approve`. Between \
boxes it builds an encrypted WireGuard mesh carrying a Geneve overlay, so \
VMs on every host share one network, with addresses handed out by its own \
DHCP responder.
.
This package contains the xdebbied daemon and the xdctl command-line tool.
"""
depends = "libvirt-daemon-system, libvirt-clients, qemu-kvm, qemu-utils, cloud-image-utils, lvm2, thin-provisioning-tools, iproute2, nftables, wireguard-tools, ufw, systemd"
section = "admin"
priority = "optional"
assets = [
    ["target/release/xdebbied", "usr/bin/", "755"],
    ["target/release/xdctl", "usr/bin/", "755"],
    # docs live with the copyright file, in /usr/share/doc/xdebbied
    ["../../README.md", "usr/share/doc/xdebbied/", "644"],
    ["../../BOOTSTRAP.md", "usr/share/doc/xdebbied/", "644"],
    ["../../docs/mesh.md", "usr/share/doc/xdebbied/", "644"],
    ["../../docs/network.md", "usr/share/doc/xdebbied/", "644"],
    ["assets/modules-load.d/xdebbie-mesh.conf", "etc/modules-load.d/", "644"],
    ["assets/apparmor.d/local/wg", "etc/apparmor.d/local/", "644"],
]
conf-files = ["/etc/modules-load.d/xdebbie-mesh.conf", "/etc/apparmor.d/local/wg"]
maintainer-scripts = "debian/"
systemd-units = { unit-name = "xdebbied", enable = true }

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
xdebbie-core = { path = "../xdebbie-core" }
futures = "0.3.34"
hex = "0.4.3"
hostname = "0.4.0"
libc = "0.2.172"
rand = "0.8.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
num_cpus = "1.16.0"
surge-ping = "0.8"
socket2 = "0.6.5"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "x509-parser", "aws_lc_rs"] }
x509-parser = "0.18.1"
tokio-rustls = "0.26"
aws-lc-rs = "1.19.0"
time = "0.3.55"
tower = "0.5"
hmac = "0.12"

[dev-dependencies]
# Paused, hand-advanced clock for the simulated-LAN discovery tests.
tokio = { version = "1.54.1", features = ["test-util"] }
http-body-util = "0.1"
walkdir = "2.5"
