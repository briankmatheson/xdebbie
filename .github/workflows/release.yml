# Tag v<version> (make tag && make push) and this builds the .deb and
# publishes a GitHub Release with the CHANGELOG section for that version.
# xdj is built on each OS's own runner (FreeBSD: cross on Linux) and attached under fixed names, so
# .../releases/latest/download/<name> always fetches the newest one (the
# aviary page links there).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  xdj:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: xdj-linux-x86_64}
          - {os: macos-latest, target: universal, asset: xdj-macos}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, asset: xdj-windows-x86_64.exe}
          - {os: ubuntu-latest, target: x86_64-unknown-freebsd, asset: xdj-freebsd-x86_64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # FreeBSD needs its sysroot and linker: cross brings them in a container.
      - if: matrix.target == 'x86_64-unknown-freebsd'
        run: cargo install cross --locked
      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = universal ]; then
            cargo build --release -p xdj --target aarch64-apple-darwin
            cargo build --release -p xdj --target x86_64-apple-darwin
            lipo -create -output "${{ matrix.asset }}" \
              target/aarch64-apple-darwin/release/xdj target/x86_64-apple-darwin/release/xdj
          elif [ "${{ matrix.target }}" = x86_64-unknown-freebsd ]; then
            cross build --release -p xdj --target x86_64-unknown-freebsd
            cp target/x86_64-unknown-freebsd/release/xdj "${{ matrix.asset }}"
          else
            cargo build --release -p xdj --target "${{ matrix.target }}"
            ext=; case "${{ matrix.target }}" in *windows*) ext=.exe;; esac
            cp "target/${{ matrix.target }}/release/xdj$ext" "${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  deb:
    # One job publishes everything, so parallel jobs never race to create
    # the release.
    needs: xdj
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: cargo deb -p xdebbied
      - uses: actions/download-artifact@v4
        with:
          path: xdj-bin
          merge-multiple: true
      - name: version and notes
        id: meta
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # the CHANGELOG section for this version: from its "## " heading
          # to the next one
          awk -v v="$v" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md \
            | sed '1d' > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: xdebbie ${{ steps.meta.outputs.version }}
          body_path: notes.md
          files: |
            target/debian/*.deb
            xdj-bin/*
