---
# Drone (aviary-drone on w10) runs what GitHub's ci.yml runs, on every push
# to Gitea, and on a tag also builds the .deb and a static Linux xdj.
#
# It builds in registry.mesh.bmath.nyc/xdebbie-builder (ci/builder.Dockerfile:
# rust with cmake, clippy, rustfmt, cargo-deb and the musl target already in)
# and keeps cargo's downloads and build output on the PVC
# aviary-drone-builds/xdebbie-cargo-cache (aviary-deploy
# by-hand/w10/drone-ha/build-cache.yaml), so a run recompiles only what
# changed. The PVC is ReadWriteOnce: two builds at once take turns.
#
# w10's workers are small (2 vCPU / 4 GiB) and already busy: the build is
# held to two rustc jobs and a 2.5 GiB limit so it cannot starve the node
# (a full node has hung a worker before).
kind: pipeline
type: kubernetes
name: xdebbie

trigger:
  event:
    - push
    - tag
    - pull_request
    - custom

clone:
  skip_verify: true

environment:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_HOME: /cache/cargo
  CARGO_TARGET_DIR: /cache/target

volumes:
  - name: cache
    claim:
      name: xdebbie-cargo-cache

steps:
  - name: check
    image: registry.mesh.bmath.nyc/xdebbie-builder:1
    volumes:
      - name: cache
        path: /cache
    resources:
      requests:
        cpu: 1000
        memory: 1536MiB
      limits:
        memory: 2560MiB
    commands:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings
      - cargo test
      - cargo run -q -p capx -- crds | diff - deploy/crds.yaml

  - name: package
    image: registry.mesh.bmath.nyc/xdebbie-builder:1
    volumes:
      - name: cache
        path: /cache
    resources:
      requests:
        cpu: 1000
        memory: 1536MiB
      limits:
        memory: 2560MiB
    commands:
      - cargo deb -p xdebbied
      - cargo build --release -p xdj --target x86_64-unknown-linux-musl
      - mkdir -p dist
      - cp "$CARGO_TARGET_DIR"/debian/*.deb dist/
      - cp "$CARGO_TARGET_DIR"/x86_64-unknown-linux-musl/release/xdj dist/xdj-linux-x86_64
      - ls -l dist
    when:
      event:
        - tag
    depends_on:
      - check
