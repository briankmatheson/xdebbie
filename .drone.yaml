---
# Drone (aviary-drone on w10): one pipeline per binary, each with its own
# status and its own cargo cache, run side by side on every push to Gitea.
# Together they cover what GitHub's ci.yml runs.
#
#   xdebbied  the daemon and xdebbie-core; fmt for the whole workspace; on tags the
#             .deb, published to https://apt.xdebbie.org (ci/apt-publish)
#   capx      the Cluster API provider; the CRD check
#   xdctl     the CLI
#
# They build in registry.mesh.bmath.nyc/xdebbie-builder (ci/builder.Dockerfile)
# with CARGO_HOME and CARGO_TARGET_DIR on a per-pipeline PVC in
# aviary-drone-builds (aviary-deploy by-hand/w10/drone-ha/build-cache.yaml),
# so a run recompiles only what changed. Each PVC is ReadWriteOnce: two runs
# of the same pipeline take turns.
#
# w10's workers are small (2 vCPU / 4 GiB): two rustc jobs per build and a
# memory limit each (2048MiB, the runner's cap; 2.5 GiB steps OOMed a 4 GiB worker
# twice on 2026-11-18); the runner gives build pods real requests
# (DRONE_RESOURCE_REQUEST_*), so the scheduler places them where there is
# room instead of stacking them on one node.
kind: pipeline
type: kubernetes
name: xdebbied

trigger:
  event: [push, tag, pull_request, custom]

# One build at a time per pipeline: the cargo cache is a ReadWriteOnce
# disk, and two builds on different nodes fought over it.
concurrency:
  limit: 1

clone:
  skip_verify: true

environment:
  # One rustc at a time: with two, the test build reached its 1536MiB
  # limit (build #46, 2026-11-18). capx and xdctl are small enough for two.
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_HOME: /cache/cargo
  CARGO_TARGET_DIR: /cache/target

volumes:
  - name: cache
    claim:
      name: xdebbie-cargo-cache
  - name: apt-publish
    secret:
      name: apt-publish
  - name: apt-signing
    secret:
      name: apt-signing
  # The public Garage's key, RW on the downloads bucket: the download server
  # (downloads.<domain>) serves that bucket's apt/ as the apt repository.
  - name: downloads-publish
    secret:
      name: downloads-publish

steps:
  - name: check
    image: registry.mesh.bmath.nyc/xdebbie-builder:2
    volumes:
      - name: cache
        path: /cache
    resources:
      limits:
        memory: 2048MiB
    commands:
      - cargo fmt --check
      - cargo clippy -p xdebbie-core -p xdebbied --all-targets -- -D warnings
      - cargo test -p xdebbie-core -p xdebbied

  - name: package
    image: registry.mesh.bmath.nyc/xdebbie-builder:2
    volumes:
      - name: cache
        path: /cache
      - name: apt-publish
        path: /secrets/apt
      - name: apt-signing
        path: /secrets/apt-signing
    resources:
      limits:
        memory: 1024MiB
    commands:
      - cargo deb -p xdebbied
      - apt-publish "$CARGO_TARGET_DIR"/debian/xdebbied_*.deb
    when:
      event: [tag]
    depends_on: [check]

  # ...and the same in the public Garage's downloads bucket, under apt/, for
  # the download server: the whole apt bucket (the repository, xdj). Copy,
  # never sync. Both places for now.
  - name: mirror-downloads
    image: registry.mesh.bmath.nyc/xdebbie-builder:2
    volumes:
      - name: apt-publish
        path: /secrets/apt
      - name: downloads-publish
        path: /secrets/downloads
    resources:
      limits:
        memory: 256MiB
    environment:
      RCLONE_CONFIG_G_TYPE: s3
      RCLONE_CONFIG_G_PROVIDER: Other
      RCLONE_CONFIG_G_ENDPOINT: http://garage.aviary-garage.svc.cluster.local:3900
      RCLONE_CONFIG_G_REGION: garage
      RCLONE_CONFIG_G_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_D_TYPE: s3
      RCLONE_CONFIG_D_PROVIDER: Other
      RCLONE_CONFIG_D_ENDPOINT: http://garage.aviary-garage-public.svc.cluster.local:3900
      RCLONE_CONFIG_D_REGION: garage
      RCLONE_CONFIG_D_FORCE_PATH_STYLE: "true"
    commands:
      - export RCLONE_CONFIG_G_ACCESS_KEY_ID=$(cat /secrets/apt/access_key) RCLONE_CONFIG_G_SECRET_ACCESS_KEY=$(cat /secrets/apt/secret_key)
      - export RCLONE_CONFIG_D_ACCESS_KEY_ID=$(cat /secrets/downloads/access_key) RCLONE_CONFIG_D_SECRET_ACCESS_KEY=$(cat /secrets/downloads/secret_key)
      - rclone copy G:apt D:downloads/apt
      - rclone ls D:downloads/apt/dists
    when:
      event: [tag]
    depends_on: [package]

---
kind: pipeline
type: kubernetes
name: capx

trigger:
  event: [push, tag, pull_request, custom]

# One build at a time per pipeline: the cargo cache is a ReadWriteOnce
# disk, and two builds on different nodes fought over it.
concurrency:
  limit: 1

clone:
  skip_verify: true

environment:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_HOME: /cache/cargo
  CARGO_TARGET_DIR: /cache/target

volumes:
  - name: cache
    claim:
      name: capx-cargo-cache

steps:
  - name: check
    image: registry.mesh.bmath.nyc/xdebbie-builder:2
    volumes:
      - name: cache
        path: /cache
    resources:
      limits:
        memory: 2048MiB
    commands:
      - cargo clippy -p capx --all-targets -- -D warnings
      - cargo test -p capx
      - cargo run -q -p capx -- crds | diff - deploy/crds.yaml

